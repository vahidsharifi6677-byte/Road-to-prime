<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>Road to Prime</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050a12;color:#eef4ff;font-family:Inter,Arial,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
:root{--gold:#ffd36a;--gold2:#f2a93b;--blue:#5ab4ff;--green:#4de28c;--red:#ff6876;--panel:#101a2a;--line:#30425c}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -15%,#2c5688 0,transparent 38%),linear-gradient(#06101b99,#050a12)}
.app{position:relative;z-index:1;max-width:520px;margin:auto;min-height:100vh;padding:14px 12px 30px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.day{font-size:12px;font-weight:900;letter-spacing:1.5px;color:#b9c8dc;background:#0d1725;border:1px solid #30445e;padding:9px 12px;border-radius:11px}
.tokens{display:flex;align-items:center;gap:7px;font-weight:1000;color:var(--gold);background:#0d1725;border:1px solid #4c5b6d;padding:7px 10px;border-radius:11px}
.coin{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;background:radial-gradient(circle at 35% 25%,#fff2a9,#e8a92f 55%,#75420c);border:2px solid #ffe9a4;box-shadow:0 0 12px #e8ac3e55}
.hero{text-align:center;padding:17px 0 14px}
.logo{font-size:clamp(38px,11vw,60px);font-weight:1000;letter-spacing:-3px;line-height:.92;text-transform:uppercase;text-shadow:0 5px 25px #000}
.logo span{color:var(--gold)}
.tag{font-size:10px;letter-spacing:4px;color:#91a5be;margin-top:9px}
.level{margin:15px 0 12px;background:#0d1725;border:1px solid var(--line);border-radius:15px;padding:10px 12px}
.levelrow{display:flex;justify-content:space-between;font-size:11px;font-weight:900}.xpbar{height:9px;background:#27364a;border-radius:20px;margin-top:7px;overflow:hidden}.xp{height:100%;width:0;background:linear-gradient(90deg,#3f8dff,#71d1ff);border-radius:20px;transition:.4s}
.shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.shortcut{border:1px solid #3a4b65;background:linear-gradient(#17263a,#0d1624);color:white;border-radius:14px;padding:13px;font-weight:1000;box-shadow:0 5px 14px #0008}
.shortcut.active{border-color:var(--gold);box-shadow:0 0 0 1px #ffd36a44,0 7px 18px #000}
.view{display:none}.view.active{display:block}
.card{background:linear-gradient(180deg,#111c2c,#0b131f);border:1px solid #30425c;border-radius:18px;padding:15px;box-shadow:0 12px 30px #0009;margin-bottom:11px}
.progress{display:flex;align-items:center;gap:15px}
.ring{--deg:0deg;width:112px;height:112px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--deg),#26364b 0);box-shadow:0 0 22px #f6b83d22}
.ring:after{content:"";position:absolute;width:84px;height:84px;background:#0a121e;border-radius:50%}.ringin{position:relative;z-index:1;text-align:center}.pct{font-size:25px;font-weight:1000}.donecount{font-size:9px;color:#899bb2;letter-spacing:1px}
.progress h2{margin:0;font-size:18px}.progress p{margin:6px 0 0;color:#92a3b9;font-size:12px;line-height:1.4}
.tasks{margin-top:14px;display:grid;gap:7px}
.task{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #26364b;border-radius:12px;background:#0b1420;transition:.18s}
.task.done{border-color:#2f865f;background:#0c2119}.box{width:24px;height:24px;border:2px solid #60718a;border-radius:7px;display:grid;place-items:center;flex:none;font-weight:1000}.done .box{background:var(--green);border-color:var(--green);color:#06130b}
.tname{font-size:13px;font-weight:800;flex:1}.reward{font-size:10px;color:var(--gold);font-weight:1000}
.complete{width:100%;border:1px solid #ffe29b;border-radius:13px;padding:13px;margin-top:13px;background:linear-gradient(#e9b948,#a96719);color:#160e05;font-weight:1000;text-transform:uppercase;box-shadow:0 7px 17px #0009}
.complete:disabled{opacity:.45;filter:grayscale(.4);cursor:not-allowed}
.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shopitem{background:linear-gradient(#17253a,#0c1523);border:1px solid #33465f;border-radius:15px;padding:12px;text-align:center}.sticker{height:90px;display:grid;place-items:center;font-size:54px;filter:drop-shadow(0 8px 8px #0009)}.shopitem h3{font-size:13px;margin:2px 0 7px}.price{font-size:11px;font-weight:1000;color:var(--gold);display:flex;justify-content:center;align-items:center;gap:5px}.buy{width:100%;margin-top:9px;border:0;border-radius:9px;padding:9px;background:#d9992f;color:#180f04;font-weight:1000}.buy:disabled{opacity:.3}
.quest label{font-size:11px;color:#aab9ca;font-weight:800;display:block;margin-bottom:5px}.quest textarea{width:100%;height:58px;background:#09121e;border:1px solid #2c3c54;border-radius:9px;color:white;padding:8px;resize:none;margin-bottom:9px;outline:0}.quest textarea:focus{border-color:var(--gold)}
.history{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:9px}.daydot{height:27px;border-radius:7px;background:#1a283a;display:grid;place-items:center;font-size:9px;font-weight:900;color:#778aa1}.daydot.done{background:#285d46;color:#a8ffd0}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,25px);opacity:0;background:#172438;border:1px solid #52657f;border-radius:11px;padding:10px 14px;font-size:12px;font-weight:900;transition:.2s;z-index:5;box-shadow:0 10px 25px #000}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:10;padding:20px}.modal.show{display:grid}.modalbox{max-width:360px;width:100%;background:#111c2c;border:1px solid #4d607b;border-radius:18px;padding:20px;text-align:center}.modalbox h2{margin:0 0 7px}.modalbox p{color:#9aacbf;font-size:12px}.modalbox button{border:0;border-radius:10px;padding:10px 18px;background:var(--gold);font-weight:1000}
@media(max-width:360px){.progress{gap:9px}.ring{width:95px;height:95px}.ring:after{width:70px;height:70px}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Road to Prime">
<meta name="theme-color" content="#07101d">

</head>
<body>
<div class="app">
  <div class="top">
    <div class="day" id="day">DAY 1</div>
    <div class="tokens"><span class="coin">★</span><span id="tokens">0</span></div>
  </div>
  <div class="hero">
    <div class="logo">Road to <span>Prime</span></div>
    <div class="tag">BETTER • STRONGER • HIGHER</div>
  </div>
  <div class="level">
    <div class="levelrow"><span id="levelText">LEVEL 1</span><span id="xpText">0 / 100 XP</span></div>
    <div class="xpbar"><div class="xp" id="xp"></div></div>
  </div>
  <div class="shortcuts">
    <button class="shortcut active" id="taskBtn">⚔️ DAILY QUESTS</button>
    <button class="shortcut" id="shopBtn">🛒 TOKEN SHOP</button>
  </div>

  <section class="view active" id="tasksView">
    <div class="card">
      <div class="progress">
        <div class="ring" id="ring"><div class="ringin"><div class="pct" id="pct">0%</div><div class="donecount" id="donecount">0 / 10</div></div></div>
        <div><h2>Today's Progress</h2><p>Complete quests to earn Tokens and XP.</p></div>
      </div>
      <div class="tasks" id="tasks"></div>
      <button class="complete" id="complete">🏆 COMPLETE DAY</button>
    </div>
    <div class="card">
      <h3 style="margin:0;font-size:14px">OPTIONAL QUESTIONS</h3>
      <p style="font-size:10px;color:#7f91a8;margin:5px 0 11px">These never change your score.</p>
      <div class="quest"><label>What did you learn today?</label><textarea id="q0"></textarea></div>
      <div class="quest"><label>What did you do better than yesterday?</label><textarea id="q1"></textarea></div>
      <div class="quest"><label>What is your goal for tomorrow?</label><textarea id="q2"></textarea></div>
      <div class="quest"><label>One thing you are grateful for:</label><textarea id="q3"></textarea></div>
    </div>
    <div class="card">
      <h3 style="margin:0;font-size:14px">RECENT DAYS</h3>
      <div class="history" id="history"></div>
    </div>
  </section>

  <section class="view" id="shopView">
    <div class="card">
      <h2 style="margin:0 0 5px;font-size:18px">TOKEN SHOP</h2>
      <p style="margin:0 0 13px;color:#8497af;font-size:11px">Spend the Tokens you earned from your quests.</p>
      <div class="shopgrid" id="shopgrid"></div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modalbox"><h2>DAY COMPLETE! 🏆</h2><p id="modalText"></p><button id="nextDay">START NEXT DAY</button></div></div>

<script>
const TASKS=[
"Wake Up at 5:00 AM","1 Hour Exercise","Follow Your Diet","Learn Trading",
"Brush Your Teeth","Take a Shower","30 Minutes Santur","4 Hours Watch Time",
"Write Journal","1:30 Hours Study"
];
const SHOP=[
{name:"Capsule Wardrobe",price:1000,icon:"👔"},
{name:"Travel",price:500,icon:"✈️"},
{name:"New Outfit",price:500,icon:"🧥"},
{name:"Sandwich",price:250,icon:"🥪"},
{name:"Chocolate",price:100,icon:"🍫"},
{name:"1 Hour Instagram",price:50,icon:"📱"}
];
const KEY="road_to_prime_pro";
let s=JSON.parse(localStorage.getItem(KEY)||"null")||{day:1,tokens:0,xp:0,done:Array(10).fill(false),answers:["","","",""],history:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1500)}
function render(){
 document.getElementById("day").textContent="DAY "+s.day;
 document.getElementById("tokens").textContent=s.tokens;
 let n=s.done.filter(Boolean).length,p=n*10;
 document.getElementById("pct").textContent=p+"%";document.getElementById("donecount").textContent=n+" / 10";
 document.getElementById("ring").style.setProperty("--deg",p*3.6+"deg");
 let level=Math.floor(s.xp/100)+1, rem=s.xp%100;
 document.getElementById("levelText").textContent="LEVEL "+level;
 document.getElementById("xpText").textContent=rem+" / 100 XP";document.getElementById("xp").style.width=rem+"%";
 const t=document.getElementById("tasks");t.innerHTML="";
 s.done.forEach((d,i)=>{let e=document.createElement("div");e.className="task"+(d?" done":"");e.innerHTML=`<div class="box">${d?"✓":""}</div><div class="tname">${TASKS[i]}</div><div class="reward">${d?"EARNED":" +1 TOKEN"}</div>`;e.onclick=()=>toggle(i);t.appendChild(e)});
 document.getElementById("complete").disabled=n===0;
 ["q0","q1","q2","q3"].forEach((id,i)=>{let e=document.getElementById(id);e.value=s.answers[i]||"";e.oninput=()=>{s.answers[i]=e.value;save()}});
 let h=document.getElementById("history");h.innerHTML="";
 for(let i=Math.max(1,s.day-6);i<=s.day;i++){let d=document.createElement("div");d.className="daydot"+(s.history.includes(i)?" done":"");d.textContent=i;h.appendChild(d)}
 renderShop();
}
function toggle(i){s.done[i]=!s.done[i];s.tokens+=s.done[i]?1:-1;s.xp+=s.done[i]?10:-10;s.xp=Math.max(0,s.xp);save();render();toast(s.done[i]?"+1 TOKEN • +10 XP":"TOKEN RETURNED")}
function renderShop(){let g=document.getElementById("shopgrid");g.innerHTML="";SHOP.forEach((it,i)=>{let d=document.createElement("div");d.className="shopitem";d.innerHTML=`<div class="sticker">${it.icon}</div><h3>${it.name}</h3><div class="price"><span class="coin">★</span>${it.price} TOKENS</div><button class="buy" ${s.tokens<it.price?"disabled":""}>BUY</button>`;d.querySelector(".buy").onclick=()=>buy(i);g.appendChild(d)})}
function buy(i){let it=SHOP[i];if(s.tokens<it.price)return;s.tokens-=it.price;save();render();toast(it.name+" PURCHASED")}
document.getElementById("taskBtn").onclick=()=>{document.getElementById("tasksView").classList.add("active");document.getElementById("shopView").classList.remove("active");document.getElementById("taskBtn").classList.add("active");document.getElementById("shopBtn").classList.remove("active")};
document.getElementById("shopBtn").onclick=()=>{document.getElementById("shopView").classList.add("active");document.getElementById("tasksView").classList.remove("active");document.getElementById("shopBtn").classList.add("active");document.getElementById("taskBtn").classList.remove("active")};
document.getElementById("complete").onclick=()=>{let n=s.done.filter(Boolean).length;s.history.push(s.day);document.getElementById("modalText").textContent=`You completed ${n}/10 quests and earned ${n} Tokens today.`;document.getElementById("modal").classList.add("show")};
document.getElementById("nextDay").onclick=()=>{s.day++;s.done=Array(10).fill(false);s.answers=["","","",""];save();document.getElementById("modal").classList.remove("show");document.getElementById("taskBtn").click();render();toast("DAY "+s.day+" UNLOCKED")};
render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>

</body>
</html>
